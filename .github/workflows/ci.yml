name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: PowerShell (parse + PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax parse (.ps1)
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { Write-Host "::error file=$($_.Name)::$($errs[0].Message)"; $bad++ }
            else { Write-Host "OK  $($_.Name)" }
          }
          exit $bad
      - name: Windows PowerShell 5.1 line-swallow check (BOM-less UTF-8)
        shell: pwsh
        run: |
          # install.ps1 is UTF-8 WITHOUT a BOM (a BOM breaks `irm | iex`). Windows PowerShell
          # 5.1 then reads `-File` runs in the system ANSI code page, where the last UTF-8
          # byte of a line ending in e.g. Hangul can pair with the newline: the NEXT line
          # silently becomes part of the comment and never runs. Fail on any such line in
          # the common East Asian / Western code pages.
          [Text.Encoding]::RegisterProvider([Text.CodePagesEncodingProvider]::Instance)
          $lines = ([IO.File]::ReadAllText("$PWD/install.ps1", [Text.Encoding]::UTF8) -replace "`r`n", "`n") -split "`n"
          $bad = 0
          foreach ($cpn in 949, 932, 936, 950, 1252) {
            $cp = [Text.Encoding]::GetEncoding($cpn)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if (-not $cp.GetString([Text.Encoding]::UTF8.GetBytes($lines[$i] + "`n")).EndsWith("`n")) {
                Write-Host "::error file=install.ps1,line=$($i + 1)::CP$cpn swallows the newline after this line - end it with an ASCII character"
                $bad++
              }
            }
          }
          if ($bad) { exit 1 }
          Write-Host "line-swallow check OK (CP949/932/936/950/1252)"
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($r) {
            $r | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::error::PSScriptAnalyzer found $($r.Count) error(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors"
      - name: install.ps1 dry-run (non-interactive smoke test)
        shell: pwsh
        env:
          DEVSETUP_DRYRUN: "1"
        run: |
          # Runs the installer end-to-end with no prompts and no real installs.
          # Child process so the script's `exit 0` doesn't end this step early.
          $out  = pwsh -NoProfile -File ./install.ps1 *>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { Write-Host "::error::install.ps1 dry-run exited $code"; exit 1 }
          if ($out -notmatch 'DRY-RUN') { Write-Host "::error::install.ps1 dry-run did not produce a plan"; exit 1 }
          Write-Host "install.ps1 dry-run smoke OK"

  shell:
    name: Shell (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: |
          for f in *.sh tests/*.sh; do echo "== $f =="; bash -n "$f"; done
      - name: shellcheck (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          for f in *.sh tests/*.sh; do echo "== $f =="; shellcheck -S error "$f"; done

  shell-config:
    name: Shell config scenarios (idempotency)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run scenario tests
        # macOS 러너에서는 /bin/bash(3.2)로 섹션을 실행 — 구버전 bash 호환 검증 포함
        run: bash tests/test_shell_config.sh
